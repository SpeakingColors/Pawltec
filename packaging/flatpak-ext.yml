# Flatpak extension: puts the Pawltec VST3 plugin where Flatpak DAWs (Bitwig, Reaper, Ardour, ...) look for plugins
# (org.freedesktop.LinuxAudio.Plugins). Built from source inside the SDK. @RUNTIME@ must match the DAW's runtime branch.
id: org.freedesktop.LinuxAudio.Plugins.Pawltec
branch: '@RUNTIME@'
runtime: org.freedesktop.LinuxAudio.BaseExtension    # defines the Plugins extension point
runtime-version: '@BASEV@'
sdk: org.freedesktop.Sdk//@RUNTIME@
build-extension: true
separate-locales: false
appstream-compose: false
build-options:
  prefix: /app/extensions/Plugins/Pawltec
modules:
  - name: Pawltec
    buildsystem: simple
    build-options:
      build-args: [--share=network]     # JUCE is fetched at build time by CMake (not at install or run time)
    build-commands:
      - cmake -S . -B _b -G Ninja -DCMAKE_BUILD_TYPE=Release
      - cmake --build _b --parallel 2 --target Pawltec_VST3
      - mkdir -p /app/extensions/Plugins/Pawltec/vst3
      - find _b -type d -name '*.vst3' -exec cp -r {} /app/extensions/Plugins/Pawltec/vst3/ \;
    sources:
      - type: dir
        path: .
